[package]
name    = "hakic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "hakic"
path = "src/main.rs"

# `haki` is the user-facing alias — same binary, friendlier name.
# `hakic` stays for tooling and CI that calls the compiler directly.
# Homebrew and install.sh expose `haki`; power users can use `hakic`.
[[bin]]
name = "haki"
path = "src/main.rs"

# Target-specific aliases. Check argv[0] at startup and inject default flags.
#   haki-gtk app.haki     →  compile + run as GTK desktop app
#   haki-dom app.haki     →  compile to .wasm for browser/DOM
#   haki-web app.haki     →  compile to .so for Apache/nginx
[[bin]]
name = "haki-gtk"
path = "src/main.rs"

[[bin]]
name = "haki-dom"
path = "src/main.rs"

[[bin]]
name = "haki-web"
path = "src/main.rs"

[dependencies]
haki_ast     = { workspace = true }
haki_lexer   = { workspace = true }
haki_parser  = { workspace = true }
haki_typeck  = { workspace = true }
haki_mono    = { workspace = true }
haki_stdlib  = { workspace = true }
haki_wasm    = { workspace = true }
haki_cemit   = { path = "../crates/haki_cemit" }
haki_pkg     = { path = "../crates/haki_pkg" }

# LSP server
tokio     = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde_json = "1"

# LLVM backend — not available on Windows (uses --emit-c path instead)
[target.'cfg(not(target_os = "windows"))'.dependencies]
haki_codegen = { workspace = true }
inkwell      = { version = "0.4", features = ["llvm17-0"] }
llvm-sys     = { version = "170", features = ["prefer-dynamic"] }
