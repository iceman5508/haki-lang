name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

# Only run on actual tag pushes, not branch pushes
# This guard catches the case where GitHub re-runs the workflow on main pushes
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: hakic
            archive: hakic-macos-arm64.tar.gz

          - os: macos-14
            target: x86_64-apple-darwin
            artifact: hakic
            archive: hakic-macos-x86_64.tar.gz

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: hakic
            archive: hakic-linux-x86_64.tar.gz

          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: hakic
            archive: hakic-linux-arm64.tar.gz


    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO - https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y llvm-17-dev libclang-17-dev clang-17
          echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@17
          LLVM_PREFIX=$(brew --prefix llvm@17)
          echo "LLVM_SYS_170_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --bin hakic
          strip target/release/hakic || true


      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          cat > /tmp/smoke.haki << 'HAKI'
          fn main() {
              print("Hello from Haki!")
          }
          HAKI
          ./target/release/hakic /tmp/smoke.haki --emit-c -o /tmp/smoke_c --quiet
          /tmp/smoke_c | grep -q "Hello from Haki!" || exit 1

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/hakic dist/
          cp LICENSE dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          tar -czf ${{ matrix.archive }} -C dist .


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Haki ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## Haki ${{ github.ref_name || inputs.tag }}

            ### Installation

            **macOS (Homebrew)**
            brew tap iceman5508/tap
            brew install haki

            **Linux / macOS (curl)**
            curl -fsSL https://raw.githubusercontent.com/iceman5508/haki-lang/main/install.sh | sh

            **Windows (winget)**
            winget install haki-lang.haki

            ### Requirements
            - `gcc` or `clang` for `--emit-c` backend (pre-installed on most systems)
            - No LLVM or Rust required for end users

            ### Usage
            hakic run hello.haki
            hakic hello.haki -o hello
            hakic hello.haki --emit-c
            hakic check hello.haki
            hakic test hello.haki
          files: |
            artifacts/*
