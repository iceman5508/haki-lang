name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: hakic
            archive: hakic-macos-arm64.tar.gz

          - os: macos-14
            target: x86_64-apple-darwin
            artifact: hakic
            archive: hakic-macos-x86_64.tar.gz

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: hakic
            archive: hakic-linux-x86_64.tar.gz

          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: hakic
            archive: hakic-linux-arm64.tar.gz

          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: hakic.exe
            archive: hakic-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO - https://apt.llvm.org/llvm.sh | sudo bash -s 17
          sudo apt-get install -y llvm-17-dev libclang-17-dev clang-17
          echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@17
          LLVM_PREFIX=$(brew --prefix llvm@17)
          echo "LLVM_SYS_170_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

      - name: No LLVM needed (Windows)
        if: runner.os == 'Windows'
        run: echo "Windows uses --emit-c backend only — no LLVM dependency"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --bin hakic
          strip target/release/hakic || true

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --bin hakic

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          printf 'fn main() { print("Hello from Haki!") }\n' > /tmp/smoke.haki
          ./target/release/hakic /tmp/smoke.haki --emit-c -o /tmp/smoke_c --quiet
          /tmp/smoke_c | grep -q "Hello from Haki!" || exit 1
          # Verify bootstrap: check and type-check work
          ./target/release/hakic check /tmp/smoke.haki
          echo "Smoke tests passed"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/hakic dist/
          cp LICENSE dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/hakic.exe dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Haki ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            artifacts/*
